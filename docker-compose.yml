services:
  backend:
    image: ghcr.io/nosttaw/trading-agent:${TRADING_AGENT_TAG:-latest}
    pull_policy: always
    environment:
      TRADING_DB_PATH: /data/trading.db
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: http://localhost:8000
      AI_LOCAL_ENDPOINT_ALLOWLIST: ${AI_LOCAL_ENDPOINT_ALLOWLIST:-}
      ENABLE_LIVE_TRADING: "false"
    volumes:
      - strategy_lab_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
volumes:
  strategy_lab_data:
