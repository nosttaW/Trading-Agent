services:
  backend:
    build: .
    environment:
      TRADING_DB_PATH: /data/trading.db
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      CORS_ORIGINS: http://localhost:5173
      AI_LOCAL_ENDPOINT_ALLOWLIST: ${AI_LOCAL_ENDPOINT_ALLOWLIST:-}
      ENABLE_LIVE_TRADING: "false"
    volumes:
      - strategy_lab_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

volumes:
  strategy_lab_data:
