name: guardrail-trading
services:
  guardrail-trading:
    image: ghcr.io/nosttaw/trading-agent:31458aa841dcb0f2523616f530854c389caf8cb5
    container_name: guardrail-trading
    restart: unless-stopped
    environment:
      TRADING_DB_PATH: /data/trading.db
      ENABLE_LIVE_TRADING: "false"
    ports:
      - "8200:8000"
    volumes:
      - guardrail_trading_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  guardrail_trading_data:
    name: guardrail-trading-data
