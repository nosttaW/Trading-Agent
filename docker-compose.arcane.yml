name: tradingagentv01
services:
  guardrail-trading:
    image: ghcr.io/nosttaw/trading-agent:${TRADING_AGENT_TAG:-latest}
    pull_policy: always
    container_name: guardrail-trading
    restart: unless-stopped
    environment:
      TRADING_DB_PATH: /data/trading.db
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://192.168.2.60:8200
      AI_LOCAL_ENDPOINT_ALLOWLIST: ${AI_LOCAL_ENDPOINT_ALLOWLIST:-192.168.2.77:8000}
      ENABLE_LIVE_TRADING: "false"
    ports:
      - "8200:8000"
    volumes:
      - guardrail_trading_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  guardrail_trading_data:
    name: guardrail-trading-data
