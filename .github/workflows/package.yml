name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend

      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image-tags
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          echo 'tags<<EOF' >> "$GITHUB_OUTPUT"
          echo 'ghcr.io/nosttaw/trading-agent:${{ github.sha }}' >> "$GITHUB_OUTPUT"
          if [[ '${{ github.ref }}' == 'refs/heads/main' ]]; then
            echo 'ghcr.io/nosttaw/trading-agent:latest' >> "$GITHUB_OUTPUT"
          fi
          echo 'EOF' >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image-tags.outputs.tags || format('ghcr.io/nosttaw/trading-agent:pr-{0}', github.event.pull_request.number) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/nosttaW/Trading-Agent
            org.opencontainers.image.revision=${{ github.sha }}
